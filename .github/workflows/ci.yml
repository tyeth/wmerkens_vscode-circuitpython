name: CI
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            npm_config_arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: armhf
            npm_config_arch: arm
          - os: macos-latest
            platform: darwin
            arch: x64
            npm_config_arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            npm_config_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm i -g npm@latest
      - run: npm --version
      - run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_config_arch }}
      - name: Electron Rebuild
        run: npm run electron-rebuild
      - name: Build stubs and board metadata
        run: |
          cd "$GITHUB_WORKSPACE"
          make all
      - name: Set VSIX target
        shell: pwsh
        run: |
          # echo "target=win32-x64" >> $env:GITHUB_ENV
          echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV
      - name: Build Package
        run: npx vsce package --target $env:target

          #./scripts/build-stubs.py all
        shell: bash
      - name: Stay on target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV
      - name: Build Package
        run: npx vsce package --target ${{ env.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target }}
          path: "*.vsix"

  build-windows-sandbox:
    name: Build (Windows Sandbox)
    runs-on: [self-hosted, windows, cp-sandbox]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Main npm install
        run: npm install

      - name: Electron Rebuild
        run: npm run electron-rebuild

      - name: Build stubs and board metadata
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          make

      - name: Set VSIX target
        shell: pwsh
        run: echo "target=win32-x64" >> $env:GITHUB_ENV

      - name: Build Package
        run: npx vsce package --target $env:target

          #./scripts/build-stubs.py all
        shell: bash
      - name: Stay on target
        shell: pwsh
        run: echo "target=${{ matrix.platform }}-${{ matrix.arch }}" >> $env:GITHUB_ENV
      - name: Build Package
        run: npx vsce package --target ${{ env.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.target }}
          path: "*.vsix"

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: success() && startsWith( github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - run: npx vsce publish --packagePath $(find . -iname *.vsix)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: npx ovsx publish --packagePath $(find . -iname *.vsix) -p $OPEN_VSX_TOKEN
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
